services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: stream-music-backend
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Dentro do container, o host do PostgreSQL é o serviço `db`.
      # DATABASE_URL tem prioridade em db.js — só defina aqui se quiser
      # apontar para um banco externo (Render/Neon/Supabase).
      DATABASE_URL: ${DATABASE_URL:-}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-stream_music}
    ports:
      - "3000:3000"
    volumes:
      # Bind mount do código-fonte para refletir edições no container.
      - .:/app
      # Volume anônimo para node_modules: impede que o bind mount
      # sobrescreva os node_modules instalados DENTRO do container
      # (que contêm vite e demais devDependencies).
      - /app/node_modules
    command: ["sh", "-c", "node server.js"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    container_name: stream-music-frontend
    working_dir: /app
    env_file:
      - .env
    environment:
      # Em dev, NÃO definir NODE_ENV=production, caso contrário o npm
      # omitiria devDependencies (vite, tailwindcss, plugin-react...).
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      VITE_LASTFM_API_KEY: ${VITE_LASTFM_API_KEY:-}
      PORT: 5173
    ports:
      - "5173:5173"
    volumes:
      # Bind mount do código-fonte para hot-reload.
      - .:/app
      # Volume anônimo para node_modules: protege os node_modules do
      # container (com vite instalado) contra a sobrescrita do host.
      - /app/node_modules
    # O CMD do Dockerfile (npx vite ...) já sobe o Vite dev server.
    # Override só torna explícito o host/port.
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: stream-music-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-stream_music}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stream_music}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
