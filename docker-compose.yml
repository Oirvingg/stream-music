services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: stream-music-backend
    image: stream-music:dev
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-stream_music}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "node server.js"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: stream-music-frontend
    image: stream-music:dev
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      VITE_LASTFM_API_KEY: ${VITE_LASTFM_API_KEY:-}
      PORT: 3000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: stream-music-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-stream_music}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stream_music}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
